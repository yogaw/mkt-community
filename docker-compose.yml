services:
  postgres:
    image: postgres:17
    container_name: mkt-community-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: market_insight_community
    # Host port 5434: 5432 and 5433 are already taken by other projects' containers.
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - mkt-community-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d market_insight_community"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mkt-community-pgdata:
